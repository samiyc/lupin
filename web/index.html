<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bornage · Lopin n°742</title>
<link rel="stylesheet" href="/web/style.css">
<script type="module" src="/web/app/main.js"></script>
</head>
<body>

<header class="topbar">
  <h1>Bornage <small>Lopin n°742</small></h1>
  <nav class="tabs" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tab-play" data-mode="play" aria-selected="true">Jouer</button>
    <button type="button" role="tab" id="tab-observe" data-mode="observe" aria-selected="false">Observer</button>
    <button type="button" role="tab" id="tab-replays" data-mode="replays" aria-selected="false">Replays</button>
  </nav>
  <a class="rules-link" href="/regles/regles.pdf" target="_blank" rel="noopener">Règles</a>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="counters">
      <div class="deck" id="deck" title="Pioche"><span class="card back" aria-hidden="true"></span><span id="pile-text"><strong>30</strong> cartes</span></div>
      <p class="turn" id="turn">Tour 1</p>
      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <section class="panel" id="panel-play">
      <button type="button" id="btn-new">Nouvelle partie</button>
      <button type="button" id="btn-reset" class="quiet">Recommencer</button>
      <p class="hint">Glisse une carte sur une borne, ou clique la carte puis la borne (touches 1 à 7). Glisse dans ta main pour la ranger.</p>
    </section>

    <section class="panel" id="panel-observe" hidden>
      <label>En bas <select id="observe-bottom"></select></label>
      <label>En haut <select id="observe-top"></select></label>
      <label>Graine <input id="observe-seed" inputmode="numeric" autocomplete="off"></label>
      <button type="button" id="btn-observe">Lancer une partie</button>
      <button type="button" id="btn-observe-save" class="quiet">Enregistrer cette partie</button>
    </section>

    <section class="panel" id="panel-replays" hidden>
      <div id="replay-list" class="replay-list"></div>
      <button type="button" id="btn-keep" class="quiet" hidden>Garder pour l'analyse</button>
    </section>

    <section class="panel player" id="player" hidden>
      <div class="player-buttons">
        <button type="button" id="btn-first" aria-label="Début de la partie" title="Début (touche Début)">⏮</button>
        <button type="button" id="btn-prev" aria-label="Coup précédent" title="Coup précédent">⏪</button>
        <button type="button" id="btn-toggle" aria-label="Lecture">▶</button>
        <button type="button" id="btn-next" aria-label="Coup suivant" title="Coup suivant">⏩</button>
        <button type="button" id="btn-last" aria-label="Fin de la partie" title="Fin, bornes réglées (touche Fin)">⏭</button>
      </div>
      <label>Vitesse
        <select id="speed">
          <option value="1600">lente</option>
          <option value="800" selected>normale</option>
          <option value="300">rapide</option>
        </select>
      </label>
      <p class="frame" id="frame"></p>
    </section>

    <section class="panel explain" id="explain" hidden aria-live="polite"></section>
  </aside>

  <section class="table" id="table" aria-label="Table de jeu">
    <p class="seat-label" id="label-top"></p>
    <div class="top-row">
      <div class="hand top" id="hand-top"></div>
      <div class="suit-bar" id="suit-bar" role="group" aria-label="Cartes vues par couleur" hidden></div>
    </div>
    <div class="board" id="board"></div>
    <div class="hand bottom" id="hand-bottom"></div>
    <div class="hand-tools" id="hand-tools">
      <p class="seat-label" id="label-bottom"></p>
      <span class="sorters" id="sorters">Trier :
        <button type="button" class="quiet" id="sort-suit">par couleur</button>
        <button type="button" class="quiet" id="sort-value">par valeur</button>
      </span>
    </div>
    <div class="banner" id="banner" hidden></div>
  </section>
</main>

<dialog id="dialog-new">
  <form method="dialog" id="form-new">
    <h2>Nouvelle partie</h2>
    <fieldset>
      <legend>Qui commence ?</legend>
      <label><input type="radio" name="first" value="me" checked> Moi</label>
      <label><input type="radio" name="first" value="bot"> Le robot</label>
    </fieldset>
    <fieldset id="opponents">
      <legend>Adversaire</legend>
    </fieldset>
    <label>Ton prénom <input name="name" id="player-name" autocomplete="given-name" maxlength="24"></label>
    <div class="actions">
      <button value="cancel" class="quiet" formnovalidate>Annuler</button>
      <button value="start" class="primary">Commencer</button>
    </div>
  </form>
</dialog>

<dialog id="dialog-reset">
  <form method="dialog">
    <h2>Recommencer ?</h2>
    <p>La partie en cours sera abandonnée et ne sera pas enregistrée.</p>
    <div class="actions">
      <button value="cancel" class="quiet">Continuer la partie</button>
      <button value="reset" class="primary">Recommencer</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

</body>
</html>
